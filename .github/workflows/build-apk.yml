name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar dependencias y crear proyecto Android
        run: |
          npm install
          npx cap add android
      - name: Ícono, vibración y orientación vertical
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24 $RES/drawable/ic_launcher_background.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f $RES/mipmap-$d/ic_launcher*.png $RES/mipmap-$d/ic_launcher*.webp
            cp icons/$d.png $RES/mipmap-$d/ic_launcher.png
            cp icons/$d.png $RES/mipmap-$d/ic_launcher_round.png
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
      - run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: elige-tus-carajos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
